name: Feature request
description: Suggest an improvement to the Momento website.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Suggestions for the **website** — content, layout, accessibility, performance.
        Ideas for the Momento iOS app belong on the
        [support page](https://momento.mogicato.ch/#/support) contact address instead.

  - type: textarea
    id: problem
    attributes:
      label: Problem or background
      description: What is missing, confusing or harder than it should be today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like to see instead?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Mockups, references to other sites, or links that help explain the idea.
    validations:
      required: false
